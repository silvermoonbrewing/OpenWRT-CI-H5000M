#CI项目
name: MT6000

#CI计划
on:
  #自动编译：每天北京时间凌晨3点（UTC 19:00）
  schedule:
    - cron: 0 19 * * *
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动追加插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: MT6000
    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置（对应 Config/MT6000.txt）
      WRT_CONFIG: MT6000
      #默认主题（argon 或 aurora，二选一）
      WRT_THEME: argon
      #默认主机名
      WRT_NAME: GLMT6000_28
      #默认WIFI名称（实际按频段区分，见 Files/etc/uci-defaults/99-mt6000-custom）
      WRT_SSID: MT6000
      #默认WIFI密码
      WRT_WORD: password
      #默认地址
      WRT_IP: 192.168.28.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/immortalwrt/immortalwrt.git
      #源码分支
      WRT_BRANCH: openwrt-25.12
      #源码名称
      WRT_SOURCE: immortalwrt/immortalwrt
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST}}
