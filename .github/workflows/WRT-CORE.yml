# ============================================================
# Hiveton H5000M 云编译公用核心
#
# 保留：
#
# - OpenClash
# - PassWall
# - ShadowSocksR Plus+
# - QModem feed
#   仅用于提供：
#     ubus-at-daemon
#     sms-tool_q
# - MT5700M 专用管理器
# - H5000M 专用配置
# - 原有 Release 二次验证
#
# H5000M 5G 管理原则：
#
#   luci-app-mt5700m      = 编译
#   ubus-at-daemon        = 编译
#   sms-tool_q            = 编译
#
#   qmodem                = 禁止
#   modem_scan            = 禁止
#   luci-app-qmodem       = 禁止
#   luci-app-qmodem-next  = 禁止
#
# 避免 QModem 与 MT5700M manager
# 同时管理 eth2，重复生成：
#
#   MT5700M
#   MT5700Mv6
#   USB
#   USBv6
#
# 增强：
#
# 1. H5000M sysupgrade.bin 必须真实存在
# 2. sysupgrade.bin 必须大于 1MB
# 3. TEST=true 不创建 Release
# 4. Release 创建以后再次检查真实附件
# 5. 修复 QModem Next 中文包反向拉入主程序
# 6. defconfig 后检查完整 QModem 不得被选中
# 7. 最终 manifest 再次检查完整 QModem 不得进入固件
# 8. TEST=true 时上传最终 Config 为 Actions Artifact
# ============================================================

name: WRT-CORE

on:
  workflow_call:
    inputs:

      WRT_CONFIG:
        required: true
        type: string

      WRT_THEME:
        required: true
        type: string

      WRT_NAME:
        required: true
        type: string

      WRT_SSID:
        required: true
        type: string

      WRT_WORD:
        required: true
        type: string

      WRT_IP:
        required: true
        type: string

      WRT_PW:
        required: true
        type: string

      WRT_REPO:
        required: true
        type: string

      WRT_BRANCH:
        required: true
        type: string

      WRT_SOURCE:
        required: true
        type: string

      WRT_PACKAGE:
        required: false
        type: string

      WRT_TEST:
        required: false
        type: string


env:

  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  WRT_CONFIG: ${{ inputs.WRT_CONFIG }}
  WRT_THEME: ${{ inputs.WRT_THEME }}
  WRT_NAME: ${{ inputs.WRT_NAME }}
  WRT_SSID: ${{ inputs.WRT_SSID }}
  WRT_WORD: ${{ inputs.WRT_WORD }}
  WRT_IP: ${{ inputs.WRT_IP }}
  WRT_PW: ${{ inputs.WRT_PW }}

  WRT_REPO: ${{ inputs.WRT_REPO }}
  WRT_BRANCH: ${{ inputs.WRT_BRANCH }}
  WRT_SOURCE: ${{ inputs.WRT_SOURCE }}

  WRT_PACKAGE: ${{ inputs.WRT_PACKAGE }}
  WRT_TEST: ${{ inputs.WRT_TEST }}


jobs:

  core:

    name: ${{ inputs.WRT_SOURCE }}

    runs-on: ubuntu-24.04

    steps:

      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout Projects
        uses: actions/checkout@main


      # ========================================================
      # 初始化环境
      # ========================================================

      - name: Initialization Environment

        env:
          DEBIAN_FRONTEND: noninteractive

        run: |

          sudo -E apt -yqq purge firefox

          sudo -E apt -yqq update

          sudo -E apt -yqq install \
            dos2unix \
            libfuse-dev

          sudo -E apt -yqq autoremove --purge

          sudo -E apt -yqq clean


          sudo -E bash -c \
            'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'


          sudo ln -sf \
            /usr/share/zoneinfo/Asia/Shanghai \
            /etc/localtime


          sudo mkdir -p /mnt/build_wrt

          sudo chown "$USER":"$USER" /mnt/build_wrt

          sudo ln -s \
            /mnt/build_wrt \
            "$GITHUB_WORKSPACE/wrt"


      # ========================================================
      # 初始化变量
      # ========================================================

      - name: Initialization Values

        run: |

          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" \
            >> "$GITHUB_ENV"


          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" \
            >> "$GITHUB_ENV"


          echo "WRT_INFO=${WRT_SOURCE%%/*}" \
            >> "$GITHUB_ENV"


          echo "WRT_TARGET=$(grep -m 1 \
            -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' \
            ./Config/$WRT_CONFIG.txt)" \
            >> "$GITHUB_ENV"


          echo "WRT_WIFI=wifi-yes" \
            >> "$GITHUB_ENV"


          echo "WRT_KVER=none" \
            >> "$GITHUB_ENV"


          echo "WRT_LIST=none" \
            >> "$GITHUB_ENV"


      # ========================================================
      # 克隆 ImmortalWrt
      # ========================================================

      - name: Clone Code

        run: |

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$WRT_BRANCH" \
            "$WRT_REPO" \
            ./wrt/


          cd ./wrt/


          echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" \
            >> "$GITHUB_ENV"


          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"


          if [ -f "$PROJECT_MIRRORS_FILE" ]; then

            sed -i \
              '/.cn\//d; /tencent/d; /aliyun/d' \
              "$PROJECT_MIRRORS_FILE"

          fi


      # ========================================================
      # 脚本处理
      # ========================================================

      - name: Check Scripts

        run: |

          find ./ \
            -maxdepth 3 \
            -type f \
            -iregex ".*\(txt\|sh\)$" \
            -exec dos2unix {} \; \
            -exec chmod +x {} \;


      # ========================================================
      # Cache
      # ========================================================

      - name: Check Caches

        id: check-cache

        if: env.WRT_TEST != 'true'

        uses: actions/cache@main

        with:

          key: ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}-${{ env.WRT_HASH }}

          restore-keys: |
            ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}

          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*


      - name: Update Caches

        if: env.WRT_TEST != 'true'

        run: |

          if [ -d "./wrt/staging_dir" ]; then

            find "./wrt/staging_dir" \
              -type d \
              -name "stamp" \
              -not -path "*target*" \
              | while read -r DIR; do

                  find "$DIR" \
                    -type f \
                    -exec touch {} +

                done


            mkdir -p ./wrt/tmp

            echo "1" > ./wrt/tmp/.build


            echo "toolchain skiped done!"

          else

            echo "caches missed!"

          fi


      # ========================================================
      # Feeds
      #
      # 保留 H5000M 原有专用 feeds：
      #
      # helloworld
      # openclash
      # qmodem
      # mt5700m
      #
      # 注意：
      #
      # QModem feed 必须保留，
      # 因为 luci-app-mt5700m 依赖：
      #
      #   ubus-at-daemon
      #   sms-tool_q
      #
      # 但是禁止完整 qmodem 进入固件。
      # ========================================================

      - name: Update Feeds

        shell: bash

        run: |

          set -euo pipefail


          cd ./wrt/


          echo "" >> feeds.conf.default


          cat >> feeds.conf.default <<-EOF
          src-git mosdns https://github.com/sbwml/luci-app-mosdns.git;v5
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          src-git helloworld https://github.com/fw876/helloworld.git
          src-git openclash https://github.com/vernesong/OpenClash.git
          src-git istore https://github.com/linkease/istore;main
          src-git qmodem https://github.com/FUjr/QModem.git;main
          src-git mt5700m https://github.com/FAN789/luci-app-mt5700m.git;main
          EOF


          echo
          echo "===== feeds.conf.default ====="

          cat feeds.conf.default

          echo "============================="
          echo


          ./scripts/feeds update -a


          # ----------------------------------------------------
          # 删除源码树自带同名包
          # ----------------------------------------------------

          rm -rf ./feeds/luci/applications/luci-app-argon-config

          rm -rf ./feeds/luci/applications/luci-app-openclash

          rm -rf ./feeds/luci/applications/luci-app-passwall

          rm -rf ./feeds/luci/themes/luci-theme-argon

          rm -rf ./feeds/packages/net/mosdns

          rm -rf ./feeds/packages/net/v2ray-geodata


          # ----------------------------------------------------
          # ImmortalWrt 自带版本偏旧
          # ----------------------------------------------------

          rm -rf ./feeds/packages/net/xray-core

          rm -rf ./feeds/packages/net/sing-box

          rm -rf ./feeds/packages/net/hysteria

          rm -rf ./feeds/packages/net/naiveproxy


          # 删除以后重新建立索引
          ./scripts/feeds update -i


          # 安装所有 feed 包定义到 package/feeds
          #
          # install -a 不代表全部编入固件，
          # 最终是否编入由 .config 决定。
          ./scripts/feeds install -a


          # ====================================================
          # 修复 QModem Next 中文包依赖
          #
          # QModem 上游 Makefile 中存在：
          #
          #   DEFAULT:=LUCI_LANG_zh_Hans||(ALL&&m)
          #   DEPENDS:=+luci-app-qmodem-next
          #
          # 当 CONFIG_LUCI_LANG_zh_Hans=y 时，
          # "+" 可能反向选中 luci-app-qmodem-next，
          # 进一步拉入完整 qmodem。
          #
          # H5000M 只需要 QModem feed 中的：
          #
          #   ubus-at-daemon
          #   sms-tool_q
          #
          # 所以把强制依赖：
          #
          #   +luci-app-qmodem-next
          #
          # 修正为普通依赖：
          #
          #   luci-app-qmodem-next
          #
          # QModem feed 本身不删除。
          # ====================================================

          QMODEM_NEXT_MK="./feeds/qmodem/luci/luci-app-qmodem-next/Makefile"


          if [ -f "$QMODEM_NEXT_MK" ]; then

            echo
            echo "========== QModem Next 依赖检查 =========="
            echo


            if grep -qE \
              '^[[:space:]]*DEPENDS:=[[:space:]]*\+luci-app-qmodem-next[[:space:]]*$' \
              "$QMODEM_NEXT_MK"; then


              sed -i -E \
                's|^([[:space:]]*)DEPENDS:=[[:space:]]*\+luci-app-qmodem-next[[:space:]]*$|\1DEPENDS:=luci-app-qmodem-next|' \
                "$QMODEM_NEXT_MK"


              echo "[OK] 已修复 QModem Next 中文包强制依赖"
              echo
              echo "原：DEPENDS:=+luci-app-qmodem-next"
              echo "新：DEPENDS:=luci-app-qmodem-next"


            else

              echo "[OK] QModem Next 中文包不存在强制依赖，无需修复"

            fi


            echo
            echo "当前相关配置："

            grep -E \
              'DEFAULT:=.*LUCI_LANG_zh_Hans|DEPENDS:=.*luci-app-qmodem-next' \
              "$QMODEM_NEXT_MK" \
              || true


            echo
            echo "=========================================="
            echo

          else

            echo "::warning::未找到 QModem Next Makefile：$QMODEM_NEXT_MK"

          fi


          # ====================================================
          # Go 1.27
          #
          # 必须在 feeds install -a 以后替换
          # 避免 package/feeds 下的软链接断掉
          # ====================================================

          rm -rf ./feeds/packages/lang/golang


          git clone \
            --depth=1 \
            --single-branch \
            --branch 27.x \
            https://github.com/sbwml/packages_lang_golang.git \
            ./feeds/packages/lang/golang


          echo
          echo "===== golang version ====="

          grep -E \
            "^GO_VERSION_(MAJOR_MINOR|PATCH)" \
            ./feeds/packages/lang/golang/golang/Makefile

          echo "=========================="
          echo


          # ----------------------------------------------------
          # 清理断链
          # ----------------------------------------------------

          find ./package/feeds/ \
            -xtype l \
            -exec rm -f {} + \
            2>/dev/null || true


      # ========================================================
      # 自定义 Packages
      # ========================================================

      - name: Custom Packages

        run: |

          cd ./wrt/package/


          "$GITHUB_WORKSPACE/Scripts/Packages.sh"

          "$GITHUB_WORKSPACE/Scripts/Handles.sh"


      # ========================================================
      # 自定义 Files
      #
      # H5000M 里面还有 5G watchdog / init.d / usr/bin
      # 所以这些脚本目录都要处理执行权限
      # ========================================================

      - name: Custom Files

        run: |

          if [ -d "$GITHUB_WORKSPACE/Files" ]; then

            mkdir -p ./wrt/files


            cp -rf \
              "$GITHUB_WORKSPACE/Files/." \
              ./wrt/files/


            for DIR in \
              ./wrt/files/etc/uci-defaults \
              ./wrt/files/etc/init.d \
              ./wrt/files/usr/bin; do


              [ -d "$DIR" ] || continue


              find "$DIR" \
                -type f \
                -exec dos2unix {} \; \
                2>/dev/null || true


              find "$DIR" \
                -type f \
                -exec chmod 755 {} \; \
                2>/dev/null || true


            done


            chmod 755 \
              ./wrt/files/etc/openclash/core/clash_meta \
              2>/dev/null || true


            echo "===== files ====="

            find ./wrt/files/ \
              -type f \
              -exec ls -l {} \;

            echo "================="

          fi


      # ========================================================
      # 应用配置
      #
      # make defconfig 后必须检查最终配置，
      # 防止依赖关系再次偷偷拉入完整 QModem。
      # ========================================================

      - name: Custom Settings

        shell: bash

        run: |

          set -euo pipefail


          cd ./wrt/


          # ----------------------------------------------------
          # 导入 H5000M 配置
          # ----------------------------------------------------

          cat \
            "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" \
            >> .config


          # ----------------------------------------------------
          # 执行通用 Settings
          # ----------------------------------------------------

          "$GITHUB_WORKSPACE/Scripts/Settings.sh"


          # ----------------------------------------------------
          # 计算最终依赖
          # ----------------------------------------------------

          make defconfig -j"$(nproc)"


          # ====================================================
          # H5000M 5G 模组配置检查
          # ====================================================

          echo
          echo "=================================================="
          echo "H5000M 5G 模组最终 .config 检查"
          echo "=================================================="
          echo


          echo "允许并且必须存在的组件："
          echo


          grep -E \
            '^CONFIG_PACKAGE_(luci-app-mt5700m|luci-i18n-mt5700m-zh-cn|ubus-at-daemon|sms-tool_q)=[ym]$' \
            .config \
            || true


          echo
          echo "完整 QModem 相关组件："
          echo


          grep -E \
            '^CONFIG_PACKAGE_(luci-app-qmodem|luci-app-qmodem-next|luci-i18n-qmodem-next-zh-cn|qmodem|modem_scan|qmodem-settings|qmodem-smsd|sms-forwarder-next|tom_modem|qmodem-seal)=[ym]$' \
            .config \
            || true


          echo
          echo "=================================================="
          echo


          # ----------------------------------------------------
          # 必须编入固件的 MT5700M 组件
          # ----------------------------------------------------

          REQUIRED_PACKAGES="
          luci-app-mt5700m
          ubus-at-daemon
          sms-tool_q
          "


          REQUIRED_ERROR=0


          for PKG in $REQUIRED_PACKAGES; do

            if ! grep -q \
              "^CONFIG_PACKAGE_${PKG}=y$" \
              .config; then


              echo "::error::H5000M 必需组件没有编入固件：$PKG"

              REQUIRED_ERROR=1

            else

              echo "[OK] 必需组件：$PKG"

            fi

          done


          if [ "$REQUIRED_ERROR" -ne 0 ]; then

            echo
            echo "::error::MT5700M 必需组件检查失败。"
            echo

            exit 1

          fi


          # ----------------------------------------------------
          # 完整 QModem 禁止进入编译
          #
          # y：编入固件
          # m：作为软件包编译
          #
          # 本项目两种都不需要。
          # ----------------------------------------------------

          FORBIDDEN_PACKAGES="
          luci-app-qmodem
          luci-app-qmodem-next
          luci-i18n-qmodem-next-zh-cn
          qmodem
          modem_scan
          qmodem-settings
          qmodem-smsd
          sms-forwarder-next
          tom_modem
          qmodem-seal
          "


          QMODEM_ERROR=0


          for PKG in $FORBIDDEN_PACKAGES; do

            if grep -Eq \
              "^CONFIG_PACKAGE_${PKG}=[ym]$" \
              .config; then


              VALUE="$(
                grep \
                  "^CONFIG_PACKAGE_${PKG}=" \
                  .config \
                  | tail -n 1
              )"


              echo "::error::发现不应该被选择的 QModem 组件：$VALUE"

              QMODEM_ERROR=1

            fi

          done


          if [ "$QMODEM_ERROR" -ne 0 ]; then

            echo
            echo "=================================================="
            echo "::error::完整 QModem 被依赖关系自动选中！"
            echo
            echo "H5000M 的设计是："
            echo
            echo "  QModem feed           = 保留"
            echo "  ubus-at-daemon        = 编译"
            echo "  sms-tool_q            = 编译"
            echo "  luci-app-mt5700m      = 编译"
            echo
            echo "  qmodem                = 禁止"
            echo "  modem_scan            = 禁止"
            echo "  luci-app-qmodem-next  = 禁止"
            echo
            echo "停止编译，避免重新生成 USB / USBv6。"
            echo "=================================================="
            echo

            exit 1

          fi


          echo
          echo "=================================================="
          echo "[OK] H5000M 5G 配置检查通过"
          echo
          echo "QModem feed           = 保留"
          echo "ubus-at-daemon        = YES"
          echo "sms-tool_q            = YES"
          echo "luci-app-mt5700m      = YES"
          echo
          echo "qmodem                = NO"
          echo "modem_scan            = NO"
          echo "luci-app-qmodem-next  = NO"
          echo "=================================================="
          echo


          # ----------------------------------------------------
          # 清理编译目录
          # ----------------------------------------------------

          make clean -j"$(nproc)"


      # ========================================================
      # 下载源码包
      # ========================================================

      - name: Download Packages

        if: env.WRT_TEST != 'true'

        run: |

          cd ./wrt/

          make download -j"$(nproc)"


      # ========================================================
      # 编译固件
      # ========================================================

      - name: Compile Firmware

        if: env.WRT_TEST != 'true'

        run: |

          cd ./wrt/


          make -j"$(nproc)" \
            || make -j"$(nproc)" V=s \
            || make -j1 V=s


      # ========================================================
      # 清理 Cache
      # ========================================================

      - name: Cleanup Caches

        if: >
          success() &&
          env.WRT_TEST != 'true' &&
          steps.check-cache.outputs.cache-hit != 'true'

        run: |

          CACHE_LIST=$(gh cache list \
            --key "$WRT_CONFIG-$WRT_INFO" \
            | cut -f 1)


          for CACHE_KEY in $CACHE_LIST; do

            gh cache delete "$CACHE_KEY"

          done


          echo "caches cleanup done!"


      # ========================================================
      # 编译机信息
      # ========================================================

      - name: Machine Information

        run: |

          cd ./wrt/


          echo "======================="

          lscpu | grep -E "name|Core|Thread"

          echo "======================="

          df -h

          echo "======================="

          du -h --max-depth=1

          echo "======================="


      # ========================================================
      # 整理固件 / 配置文件
      # ========================================================

      - name: Package Firmware

        shell: bash

        run: |

          set -euo pipefail


          cd ./wrt/


          rm -rf ./upload/

          mkdir -p ./upload/


          # 无论 TEST=true 还是正常编译，
          # 都保存 make defconfig 后的最终配置文件。
          cp -f \
            ./.config \
            ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt


          if [[ "$WRT_TEST" != 'true' ]]; then


            # ==================================================
            # 最终固件 Manifest 检查
            #
            # 这里检查真正进入 H5000M 固件的包，
            # 防止 .config 检查以后还有意外变化。
            # ==================================================

            echo
            echo "=================================================="
            echo "H5000M 最终 Manifest 5G 组件检查"
            echo "=================================================="
            echo


            MANIFEST_FILES="$(find ./bin/targets/ -type f -name '*.manifest' -print)"


            if [ -z "$MANIFEST_FILES" ]; then

              echo "::error::没有找到固件 manifest 文件！"

              exit 1

            fi


            echo "MT5700M 必需组件："
            echo


            for PKG in \
              luci-app-mt5700m \
              ubus-at-daemon \
              sms-tool_q; do


              if grep -qh \
                "^${PKG} - " \
                $MANIFEST_FILES; then

                echo "[OK] $PKG"

              else

                echo "::error::最终固件缺少必需组件：$PKG"

                exit 1

              fi

            done


            echo
            echo "检查禁止进入固件的完整 QModem："
            echo


            MANIFEST_QMODEM_ERROR=0


            for PKG in \
              luci-app-qmodem \
              luci-app-qmodem-next \
              luci-i18n-qmodem-next-zh-cn \
              qmodem \
              modem_scan \
              qmodem-settings \
              qmodem-smsd \
              sms-forwarder-next \
              tom_modem \
              qmodem-seal; do


              if grep -qh \
                "^${PKG} - " \
                $MANIFEST_FILES; then

                echo "::error::最终固件中发现禁止组件：$PKG"

                MANIFEST_QMODEM_ERROR=1

              fi

            done


            if [ "$MANIFEST_QMODEM_ERROR" -ne 0 ]; then

              echo
              echo "=================================================="
              echo "::error::完整 QModem 已进入最终固件！"
              echo "::error::停止打包和创建 Release。"
              echo "=================================================="
              echo

              exit 1

            fi


            echo
            echo "[OK] 最终固件中没有完整 QModem"
            echo "[OK] 不会由 QModem 创建 USB / USBv6"
            echo
            echo "=================================================="
            echo


            # ==================================================
            # 内核版本
            # ==================================================

            WRT_KERNEL_VERSION=$(

              find ./bin/targets/ \
                -type f \
                -name "*.manifest" \
                -exec grep -oP \
                  '^kernel - \K[\d\.]+' \
                  {} \; \
                | head -n 1

            )


            if [ -n "$WRT_KERNEL_VERSION" ]; then

              echo "WRT_KVER=$WRT_KERNEL_VERSION" \
                >> "$GITHUB_ENV"

            fi


            # ==================================================
            # LuCI 插件列表
            # ==================================================

            WRT_LUCI_LIST=$(

              find ./bin/targets/ \
                -type f \
                -name "*.manifest" \
                -exec grep -oP \
                  '^luci-(app|theme)[^ ]*' \
                  {} \; \
                | sort -u \
                | tr '\n' ' '

            )


            if [ -n "$WRT_LUCI_LIST" ]; then

              echo "WRT_LIST=$WRT_LUCI_LIST" \
                >> "$GITHUB_ENV"

            fi


            echo
            echo "========== 原始编译产物 =========="

            find ./bin/targets/ \
              -type f \
              -printf '%p\t%k KB\n' \
              | sort

            echo "=================================="


            # --------------------------------------------------
            # 删除不需要发布的文件
            # --------------------------------------------------

            find ./bin/targets/ \
              -iregex \
              ".*\(buildinfo\|json\|sha256sums\|packages\)$" \
              -exec rm -rf {} +


            # ==================================================
            # 重命名目标固件
            # ==================================================

            while IFS= read -r -d '' FILE; do


              EXT=$(basename "$FILE" | cut -d '.' -f 2-)


              NAME=$(

                basename "$FILE" \
                  | cut -d '.' -f 1 \
                  | grep -io "\($WRT_TARGET\).*"

              )


              NEW_FILE="$NAME-$WRT_INFO-$WRT_BRANCH-$WRT_WIFI-$WRT_DATE.$EXT"


              echo
              echo "重命名固件："
              echo "$FILE"
              echo "-> ./upload/$NEW_FILE"
              echo


              mv -f \
                "$FILE" \
                "./upload/$NEW_FILE"


            done < <(

              find ./bin/targets/ \
                -type f \
                -iname "*$WRT_TARGET*" \
                -print0

            )


            # --------------------------------------------------
            # 剩余文件移动到 upload
            # --------------------------------------------------

            find ./bin/targets/ \
              -type f \
              -exec mv -f {} ./upload/ \;


            echo
            echo "========== 待发布文件 =========="


            find ./upload/ \
              -maxdepth 1 \
              -type f \
              -printf '%f\t%k KB\n' \
              | sort


            echo "================================"
            echo


            # ==================================================
            # H5000M 固件核心验证
            #
            # 必须满足：
            #
            # 1. H5000M sysupgrade.bin 存在
            # 2. 文件必须大于 1MB
            # ==================================================

            SYSUPGRADE_FILE=$(

              find ./upload/ \
                -maxdepth 1 \
                -type f \
                -iname '*h5000m*sysupgrade*.bin' \
                -print \
                -quit

            )


            if [ -z "$SYSUPGRADE_FILE" ]; then

              echo
              echo "::error::没有找到 H5000M sysupgrade.bin！"
              echo "::error::虽然 make 可能返回成功，但是没有生成真正的 H5000M 固件。"
              echo "::error::停止创建 GitHub Release。"
              echo

              exit 1

            fi


            SYSUPGRADE_SIZE=$(stat -c%s "$SYSUPGRADE_FILE")


            if [ "$SYSUPGRADE_SIZE" -lt 1048576 ]; then

              echo
              echo "::error::H5000M sysupgrade.bin 大小异常！"
              echo "::error::文件：$SYSUPGRADE_FILE"
              echo "::error::大小：${SYSUPGRADE_SIZE} bytes"
              echo "::error::小于 1MB，停止创建 GitHub Release。"
              echo

              exit 1

            fi


            echo
            echo "[OK] H5000M sysupgrade.bin 检查成功"
            echo "[OK] 文件：$SYSUPGRADE_FILE"
            echo "[OK] 大小：${SYSUPGRADE_SIZE} bytes"
            echo


          fi


      # ========================================================
      # TEST 模式结果
      #
      # TEST=true：
      #
      # 只生成最终 Config
      # 不下载源码包
      # 不编译固件
      # 不创建 Release
      # ========================================================

      - name: Test Mode Result

        if: env.WRT_TEST == 'true'

        shell: bash

        run: |

          set -euo pipefail


          echo
          echo "=================================================="
          echo "TEST 模式"
          echo "=================================================="
          echo
          echo "最终配置检查已经完成"
          echo "不下载源码包"
          echo "不编译 H5000M 固件"
          echo "不创建 GitHub Release"
          echo
          echo "生成的配置文件："
          echo


          find ./wrt/upload/ \
            -maxdepth 1 \
            -type f \
            -name 'Config-*.txt' \
            -exec ls -lh {} \;


          echo
          echo "配置文件将在下面的 Upload Test Config 步骤上传"
          echo "任务完成后可在 GitHub Actions 的 Artifacts 中下载"
          echo
          echo "=================================================="


      # ========================================================
      # TEST 模式上传 Config
      #
      # GitHub Actions Runner 在任务结束以后会被销毁。
      #
      # 因此 TEST=true 时必须将最终 Config
      # 作为 GitHub Actions Artifact 上传保存。
      #
      # 正常编译模式不会执行这里，
      # Config + 固件仍然通过 GitHub Release 发布。
      # ========================================================

      - name: Upload Test Config

        if: env.WRT_TEST == 'true'

        uses: actions/upload-artifact@v4

        with:

          name: Config-${{ inputs.WRT_CONFIG }}-${{ inputs.WRT_BRANCH }}

          path: |
            ./wrt/upload/Config-*.txt

          if-no-files-found: error

          retention-days: 7


      # ========================================================
      # 创建 GitHub Release
      #
      # H5000M 当前使用 GitHub CLI
      # 不依赖 softprops/action-gh-release
      # ========================================================

      - name: Release Firmware

        if: env.WRT_TEST != 'true'

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}-${{ env.WRT_BRANCH }}-${{ env.WRT_DATE }}

        run: |

          set -euo pipefail


          cd ./wrt/


          echo
          echo "准备创建 Release："
          echo "$RELEASE_TAG"
          echo


          cat > /tmp/release-body.md <<EOF
          源码：${WRT_REPO}
          分支：${WRT_BRANCH}
          提交：${WRT_HASH}

          配置：${WRT_CONFIG}
          平台：${WRT_TARGET}

          登录地址：${WRT_IP}
          登录密码：${WRT_PW}

          WIFI名称：${WRT_SSID}
          WIFI密码：${WRT_WORD}

          内核版本：${WRT_KVER}
          插件列表：${WRT_LIST}
          EOF


          echo
          echo "========== 上传文件 =========="

          ls -lh ./upload/

          echo "=============================="


          gh release create \
            "$RELEASE_TAG" \
            ./upload/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file /tmp/release-body.md


          echo
          echo "[OK] GitHub Release 创建命令执行完成"
          echo


      # ========================================================
      # Release 上传后二次验证
      #
      # 只有正常编译模式才执行
      # ========================================================

      - name: Verify Release

        if: env.WRT_TEST != 'true'

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}-${{ env.WRT_BRANCH }}-${{ env.WRT_DATE }}

        run: |

          set -euo pipefail


          echo
          echo "========== Release 校验 =========="
          echo


          echo "Release Tag：$RELEASE_TAG"
          echo


          # ----------------------------------------------------
          # 读取 GitHub 上真实存在的 Release
          # ----------------------------------------------------

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets \
            --jq '.'


          echo
          echo "========== GitHub 已上传资产 =========="
          echo


          ASSETS="$(

            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'

          )"


          printf '%s\n' "$ASSETS"


          echo
          echo "======================================="
          echo


          if ! printf '%s\n' "$ASSETS" \
            | grep -qiE 'h5000m.*sysupgrade.*\.bin$'; then

            echo
            echo "::error::GitHub Release 已创建，但是里面没有 H5000M sysupgrade.bin！"
            echo "::error::Release 上传结果校验失败。"
            echo

            exit 1

          fi


          echo
          echo "=================================="
          echo "Release 创建成功"
          echo "H5000M 固件上传成功"
          echo "Release 资产校验成功"
          echo "=================================="
          echo
